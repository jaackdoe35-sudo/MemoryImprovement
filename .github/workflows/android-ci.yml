name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Assemble debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MemoryImprovement-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  instrumentation:
    name: Room migration integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Run Room migration integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-boot-timeout: 600
          script: gradle connectedDebugAndroidTest
