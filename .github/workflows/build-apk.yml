name: Build MemoryImprovement APK

on:
  push:
    branches:
      - redesign-beginner-first-ux

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # The repository currently does not expose a Gradle wrapper at its root.
      # Generate one on the runner, then use the requested ./gradlew build command.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemoryImprovement-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
