name: Compose emulator screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/compose-screenshots.yml'

permissions:
  contents: write

concurrency:
  group: compose-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    name: Capture real emulator screens
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build debug APK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          gradle assembleDebug
      - name: Boot phone emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p docs/screenshots
            adb wait-for-device
            # Normalize to a tall phone viewport so tap targets and screenshots are repeatable.
            adb shell wm size 1080x2400
            adb shell settings put system font_scale 1.0
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.memoryimprovement.app
            adb shell am start -n com.memoryimprovement.app/.MainActivity
            sleep 8

            capture() {
              name="$1"
              adb exec-out screencap -p > "docs/screenshots/$name.png"
              test -s "docs/screenshots/$name.png"
            }
            tap_text() {
              label="$1"
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml /tmp/window.xml >/dev/null
              bounds="$(python3 - "$label" <<'PY'
import sys, xml.etree.ElementTree as ET
label=sys.argv[1]
root=ET.parse('/tmp/window.xml').getroot()
nodes=list(root.iter('node'))
for node in nodes:
    text=node.attrib.get('text','').strip()
    desc=node.attrib.get('content-desc','').strip()
    if text == label or desc == label or (label == 'Add memory' and label in text):
        bounds=node.attrib.get('bounds','')
        if bounds:
            print(bounds)
            break
PY
              )"
              if [ -z "$bounds" ]; then
                echo "Could not find visible UI control: $label" >&2
                cat /tmp/window.xml >&2
                return 1
              fi
              coords="$(python3 - "$bounds" <<'PY'
import re,sys
m=re.fullmatch(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',sys.argv[1])
if not m: raise SystemExit('Unexpected bounds: '+sys.argv[1])
x1,y1,x2,y2=map(int,m.groups())
print((x1+x2)//2,(y1+y2)//2)
PY
              )"
              adb shell input tap $coords
              sleep 2
            }

            # Light mode: reset system night mode, then capture Today.
            adb shell cmd uimode night no
            sleep 3
            adb shell am force-stop com.memoryimprovement.app
            adb shell am start -n com.memoryimprovement.app/.MainActivity
            sleep 6
            capture today-light

            # Navigate by actual visible text, not brittle screen coordinates.
            tap_text "Palace"
            capture palace-light
            tap_text "Recall"
            capture recall-light
            tap_text "Library"
            capture library-light

            # Open memory creation from Library; capture the actual Compose dialog.
            tap_text "Add memory"
            sleep 2
            capture creation-light

            # Dismiss creation, switch to dark, restart and capture the same screens.
            adb shell input keyevent 4
            adb shell cmd uimode night yes
            sleep 3
            adb shell am force-stop com.memoryimprovement.app
            adb shell am start -n com.memoryimprovement.app/.MainActivity
            sleep 6
            capture today-dark
            tap_text "Palace"
            capture palace-dark
            tap_text "Recall"
            capture recall-dark
            tap_text "Library"
            capture library-dark
            tap_text "Add memory"
            sleep 2
            capture creation-dark

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-emulator-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Commit captured screenshots to PR branch
        if: success() && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "Add real emulator screenshots for light and dark themes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
