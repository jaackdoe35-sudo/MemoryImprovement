name: Compose emulator screenshots

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/compose-screenshots.yml'

permissions:
  contents: write

concurrency:
  group: compose-screenshots-${{ github.ref }}
  cancel-in-progress: false

jobs:
  screenshots:
    name: Capture real emulator screens
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build debug APK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          gradle assembleDebug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot phone emulator and capture screens
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          disable-animations: true
          script: |
            set -eu
            echo "ADB devices immediately after emulator runner startup:"
            adb devices

            echo "Resetting ADB server..."
            adb kill-server || true
            adb start-server || true

            echo "Waiting for emulator to boot..."
            timeout=0
            until adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do
              sleep 5
              timeout=$((timeout+5))
              if [ "$timeout" -ge 180 ]; then
                echo "Emulator failed to boot within 180 seconds. Exiting."
                adb devices
                adb version
                exit 1
              fi
            done
            echo "Emulator booted successfully!"
            adb devices

            mkdir -p docs/screenshots
            # Normalize to a tall phone viewport for repeatable screenshots.
            adb shell wm size 1080x2400
            adb shell settings put system font_scale 1.0
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            capture() {
              name="$1"
              adb exec-out screencap -p > "docs/screenshots/$name.png"
              test -s "docs/screenshots/$name.png"
            }

            # First incremental capture: Today screen in light mode only.
            adb shell cmd uimode night no
            sleep 3
            adb shell am force-stop com.memoryimprovement.app
            adb shell am start -n com.memoryimprovement.app/.MainActivity
            sleep 6
            capture today-light

      - name: Upload emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-emulator-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Commit captured screenshots to PR branch
        if: success() && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes to commit."
            exit 0
          fi
          git commit -m "Add real emulator screenshots for light and dark themes"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
